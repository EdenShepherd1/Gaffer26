<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2fd6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gaffer 26">
<title>Gaffer 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: teletext-page shell. Coloured band per page, boxy panels, mono data tables, blue/yellow on black (dark) or navy on pale grey (light). */
:root{
  --bg:#e8edf0; --panel:#f8fafb; --fg:#0c1a21; --muted:#4f656f; --line:#c2cdd2;
  --band:#0b2fd6; --band-ink:#ffffff; --accent:#0b2fd6; --accent-ink:#ffffff;
  --cy:#006d85; --good:#0a7a3d; --bad:#c21a1a; --warn:#a85d00; --me:#dfe7ff; --shade:#eef2f4;
  --f-disp:'VT323','Courier New',monospace; --f-body:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif; --f-data:'IBM Plex Mono','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04060a; --panel:#0a1017; --fg:#e9f1f3; --muted:#8ea3ab; --line:#1b2933;
    --band:#1b2cff; --band-ink:#ffffff; --accent:#ffe600; --accent-ink:#04060a;
    --cy:#00e5ff; --good:#3ddc84; --bad:#ff5a5a; --warn:#ffb020; --me:#141d3d; --shade:#0e161e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04060a; --panel:#0a1017; --fg:#e9f1f3; --muted:#8ea3ab; --line:#1b2933;
  --band:#1b2cff; --band-ink:#ffffff; --accent:#ffe600; --accent-ink:#04060a;
  --cy:#00e5ff; --good:#3ddc84; --bad:#ff5a5a; --warn:#ffb020; --me:#141d3d; --shade:#0e161e; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.35}
.app{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.disp{font-family:var(--f-disp);letter-spacing:.02em;line-height:1}
.data,.tbl td,.tbl th{font-family:var(--f-data)}
.muted{color:var(--muted)}
.cy{color:var(--cy)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--accent)}
.sp{flex:1}

/* masthead + nav */
.mast{display:flex;align-items:center;gap:12px;background:var(--band);color:var(--band-ink);padding:4px 12px;font-family:var(--f-disp);font-size:1.7rem;flex-wrap:wrap}
.mast .logo{color:var(--band-ink);letter-spacing:.06em}
.mast-mid{color:var(--accent-ink);background:var(--accent);padding:0 8px}
.mast-r{margin-left:auto;font-size:1.35rem}
.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-block:0 14px;border:2px solid var(--band);border-top:0;background:var(--panel)}
.nav button{min-width:0;background:transparent;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 4px;cursor:pointer;display:flex;gap:6px;align-items:baseline;justify-content:center;font-size:.98rem}
.nav button:nth-child(6n),.nav button:last-child{border-right:0}.nav button:nth-child(n+7){border-bottom:0}
@media(max-width:760px){.nav{grid-template-columns:repeat(4,1fr)}.nav button:nth-child(6n){border-right:1px solid var(--line)}.nav button:nth-child(4n){border-right:0}.nav button:nth-child(n+7){border-bottom:1px solid var(--line)}.nav button:nth-child(n+9){border-bottom:0}}
@media(max-width:440px){.nav{grid-template-columns:repeat(3,1fr)}.nav button{gap:4px;font-size:.88rem}.nav .pn{font-size:1.1rem}.nav button:nth-child(4n){border-right:1px solid var(--line)}.nav button:nth-child(3n){border-right:0}.nav button:nth-child(n+9){border-bottom:1px solid var(--line)}.nav button:nth-child(n+10){border-bottom:0}}
.nav .pn{font-family:var(--f-disp);font-size:1.25rem;color:var(--accent)}
.nav button:hover{background:var(--shade)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav button[aria-current="page"] .pn{color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--cy);outline-offset:1px}

/* bands, panels */
.band{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--band);color:var(--band-ink);font-family:var(--f-disp);font-size:1.5rem;padding:2px 12px;flex-wrap:wrap}
.band.alt{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--panel);border:2px solid var(--band);border-top:0;padding:12px;margin-bottom:14px}
.panel.plain{border-top:2px solid var(--band)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.big{font-family:var(--f-disp);font-size:2.6rem;line-height:1}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-family:var(--f-disp);font-size:2.1rem;font-weight:400;line-height:1}

/* buttons */
.btn{background:var(--panel);border:2px solid var(--fg);padding:5px 12px;cursor:pointer;font-weight:600;letter-spacing:.02em}
.btn:hover{background:var(--shade)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:1px 8px;font-size:.84rem;border-width:1px}
.btn.on{background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:6px}

/* tables */
.scroll{overflow-x:auto;max-width:100%}
.winbar{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;padding:6px 10px;margin-bottom:10px;border:2px solid var(--line);font-size:.9rem}.winbar b{font-family:var(--f-data);letter-spacing:.06em;font-size:.8rem}.winbar.open{border-color:var(--good)}.winbar.open b{color:var(--good)}.winbar.late{border-color:var(--warn,#e8a317)}.winbar.late b{color:var(--warn,#e8a317)}.winbar.shut{border-color:var(--bad)}.winbar.shut b{color:var(--bad)}
.offer{border-bottom:1px solid var(--line);padding:8px 2px;display:flex;flex-direction:column;gap:6px}.offer .oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.offer .od{font-size:.9rem}.offer .row{flex-wrap:wrap;align-items:flex-end}
.blogo{flex:none;border-radius:5px;vertical-align:middle}.bn{display:inline-flex;align-items:center;gap:8px;min-width:0}
.gplan{width:100%;max-width:640px;height:auto;display:block;margin-inline:auto;border:2px solid var(--line)}.gplan text{font-family:var(--f-data);text-anchor:middle;pointer-events:none}.gplan .gcap{font-size:13px;fill:#fff;opacity:.85}
.shirtrow{display:flex;align-items:center;gap:14px}.shirt{width:96px;height:auto;flex:none}
.tbl tr.splitrow td{border-top:3px double var(--ink,#444)}
span.cdy,span.cdr{display:inline-block;width:8px;height:11px;border-radius:1px;vertical-align:-1px;margin-right:3px}span.cdy{background:#f2c200}span.cdr{background:#d62828}
.plink{cursor:pointer;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}.plink:hover,.plink:focus{color:var(--link,#0b3bd8);text-decoration:underline}
.phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.phead .crest{width:52px;height:52px;font-size:1rem;flex:none}.povr{margin-left:auto;text-align:center}.povr b{font-family:var(--f-data);font-size:2.6rem;line-height:1}
.pstat{display:grid;grid-template-columns:8.5em 1fr 2.2em;gap:8px;align-items:center}.pstat b{font-family:var(--f-data);text-align:right}
.trgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.trc{display:flex;gap:10px;align-items:center;border:2px solid var(--line);padding:6px 10px}
.gl{padding:2px 0}.gm{font-family:var(--f-data);color:var(--muted)}
.sbar{display:grid;grid-template-columns:2.4em 1fr 2.4em;gap:4px 8px;align-items:center;margin:4px 0;font-variant-numeric:tabular-nums}.sbar .v{font-family:var(--f-data);text-align:center}.sbar .lb{grid-column:1/-1;text-align:center;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px;order:-1}
.sbar .bb{display:flex;gap:3px;height:8px;background:var(--line)}.sbar .bb i{display:block;height:100%}.sbar .bb .l{background:#1b6fa8}.sbar .bb .r{background:#c0392b;margin-left:auto}
.rtt td{padding:3px 6px}.rtt tr.mvp{background:var(--me)}.rtg{display:inline-block;min-width:2.6em;text-align:center;padding:1px 6px;border-radius:3px;font-family:var(--f-data);background:#d8dde3;color:#111}.rtg.hi{background:#0a8f3c;color:#fff}.rtg.good{background:#8fd19e;color:#06240f}.rtg.meh{background:#f2c879;color:#3a2800}.rtg.lo{background:#d9534f;color:#fff}
.momb{text-align:center;padding:6px;border:2px solid var(--line)}
.adr{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 14px;align-items:center;padding:5px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.adr .nm{font-weight:500;min-width:0}.adr .pr,.adr .wk{font-family:var(--f-data);font-size:.84rem;text-align:right;white-space:nowrap}.adr .act{text-align:right;min-width:64px}
.adr.on .nm{font-weight:700}.adr.on{background:var(--me);padding-left:8px;padding-right:8px}
@media(max-width:560px){.adr{grid-template-columns:1fr auto auto}.adr .nm{grid-column:1/-1}.adr .pr{text-align:left}.adr .wk{text-align:left}}
.tbl{width:100%;border-collapse:collapse;font-size:.84rem}
.tbl th{font-family:var(--f-body);font-weight:600;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td.nm{font-family:var(--f-body);font-size:.95rem;font-weight:500}
.tbl .r{text-align:right}
.tbl tr.me td{background:var(--me)}
.tbl tr.zt td:first-child{box-shadow:inset 4px 0 0 var(--good)}
.tbl tr.zb td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.tbl tr.inj td{color:var(--muted)}
.tbl tr.xi td.nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}
.tbl tr.xi td.nm.bn::before{display:none}
.pos{display:inline-block;min-width:2.2em;text-align:center;font-family:var(--f-data);font-size:.74rem;padding:0 3px;border:1px solid var(--line)}
.pos.GK{color:var(--warn)} .pos.DF{color:var(--cy)} .pos.MF{color:var(--good)} .pos.FW{color:var(--bad)}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px;border:1px solid var(--fg);vertical-align:baseline}
.fm{display:inline-flex;gap:2px}
.fm i{display:inline-block;width:14px;height:14px;font-style:normal;font-size:.65rem;line-height:14px;text-align:center;color:#fff;font-family:var(--f-data)}
.fm .W{background:#0a7a3d} .fm .D{background:#7a7a7a} .fm .L{background:#c21a1a}
.meter{height:12px;background:var(--shade);border:1px solid var(--line);min-width:60px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.g i{background:var(--good)} .meter.r i{background:var(--bad)} .meter.c i{background:var(--cy)}

/* news */
.room{width:100%;max-width:760px;height:auto;display:block;margin-inline:auto;border:2px solid var(--line)}
.room .wall{fill:#8798ab}.room .dado{fill:#6f6a8a}.room .rail{fill:#e9e2d0}.room .floor{fill:#6b4a30}.room .plank{stroke:#573a24;stroke-width:2}.room .skirt{fill:#e9e2d0}.room .rug{fill:#7b2d36;stroke:#c9a64b;stroke-width:3}
.room .winf{fill:#e9e2d0}.room .win{fill:#a9dcff}.room .winsill{fill:#d8d0bb}.room .curt{fill:#9b3a44}
.room .cal{fill:#f4efe0}.room .calsh{fill:#0003}.room .calh{fill:#c0392b}.room .cell{fill:#fff;stroke:#bbb}.room .pin{fill:#ddd}
.room text{font-family:var(--f-data);font-size:13px;text-anchor:middle;pointer-events:none;fill:#fff}
.room .tvb{fill:#1c1c1f}.room .scr{fill:#000}.room .glare{fill:url(#none);fill-opacity:0}.room .tvst{fill:#2a2a2e}.room .led{fill:#3ddc57}
.room .tt1{fill:#ffe600;text-anchor:start;font-size:14px}.room .tt2{fill:#00e5ff;text-anchor:start;font-size:12px}.room .tt3{fill:#6bff6b;text-anchor:start;font-size:12px}
.room .unitt{fill:#7a5230}.room .cab{fill:#5b3c22}.room .door{fill:#6a4628;stroke:#3f2915;stroke-width:1.5}.room .knob{fill:#d8b25a}.room .unitl{fill:#3f2915}
.room .chb{fill:#2b2220}.room .chb2{fill:#4a3a33}.room .chh{fill:#3a2d28}.room .chp{fill:#2b2220}
.room .deskb{fill:#6e4520}.room .dsh{fill:#0004}.room .drw{fill:#7d5128;stroke:#4a2d14;stroke-width:1.5}.room .hnd{fill:#d8b25a}.room .deskl{fill:#4a2d14}.room .desk{fill:#a06a35}.room .deske{fill:#5b3a1a}
.room .lapb{fill:#3a3f47}.room .laps{fill:#143048}.room .lapbar{fill:#1f5f8f}.room .lapl{fill:#7dd3fc;opacity:.8}.room .lapbadge{fill:#e53935}.room .lapn{font-size:11px;font-weight:700}.room .lapk{fill:#6a7079}.room .lapt2{fill:#4d535b}
.room .pap{fill:#f1ead6}.room .papsh{fill:#0003}.room .papf{stroke:#c9c0a5;stroke-width:1}.room .papm{fill:#222}.room .papl{fill:#888}
.room .mug rect{fill:#fff}
.room .shelf{fill:#8a5a2b}.room .shelfb{fill:#5b3a1a}
.room .obj{cursor:pointer}.room .hit{fill:transparent}.room .obj:hover .hit,.room .obj:focus .hit,.room .obj.sel .hit{stroke:#ffe600;stroke-width:3;stroke-dasharray:6 4}
.lapx{max-width:640px;margin-inline:auto;width:100%}.lapbez{background:#2b2f36;border-radius:12px 12px 4px 4px;padding:10px 10px 12px;border:2px solid #14171b}
.lapscr{background:#0f2338;color:#dbeafe;border-radius:3px;min-height:260px;font-family:var(--f-data);font-size:15px;overflow:hidden}
.lapbase{height:14px;background:linear-gradient(#9aa1ab,#6a7079);border-radius:0 0 18px 18px;margin:0 -18px;box-shadow:0 4px 6px #0005}
.lapmenu{display:flex;justify-content:space-between;background:#1f5f8f;color:#fff;padding:5px 10px}
.lapscr .mbtn{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#17304a;flex-wrap:wrap}.lapscr .sp{flex:1}.lapscr .btn{background:#dbeafe;color:#0f2338;border-color:#dbeafe}
.lapscr ul{list-style:none;margin:0;padding:0}.mli{display:grid;grid-template-columns:7em 1fr auto;gap:8px;padding:8px 10px;border-bottom:1px solid #24435f;cursor:pointer}
.mli:hover,.mli:focus{background:#1b3a58}.mli.unread .mt{font-weight:700;color:#fff}.mli .md{color:#8fb4d6;font-size:13px}.mli .mf{color:#8fb4d6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4cc2ff;margin-right:6px}
.mfil{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid #24435f}.mfil .btn.on{background:#2d6ea8;color:#fff}.tip .chip{flex:none}.mli .chip{font-size:11px}.mnone{padding:30px 10px;text-align:center;color:#8fb4d6}.mview .mh{padding:10px;border-bottom:1px solid #24435f;line-height:1.5}.mview .mb{padding:12px 10px;line-height:1.55;white-space:pre-wrap}
@media(max-width:600px){.lapscr{font-size:14px}.mli{grid-template-columns:1fr auto}.mli .mf{display:none}}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.news li{padding:7px 0;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0}
.news .t{font-weight:600}
.news .w{font-family:var(--f-data);font-size:.72rem;color:var(--muted)}
.flash{border:2px solid var(--accent);background:var(--panel);padding:6px 10px;margin-bottom:12px;font-weight:600}
.flash.bad{border-color:var(--bad)}

/* fixture card */
.fix{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.fix .tm{display:flex;flex-direction:column;gap:2px;align-items:center;min-width:0}
.fix .nm{font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.crest{width:44px;height:44px;border:2px solid var(--fg);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:1.05rem;letter-spacing:-.02em;line-height:1;overflow:hidden;color:#fff;flex:none}

/* inputs */
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld input,.fld select,textarea{background:var(--bg);border:2px solid var(--line);padding:5px 8px;min-width:0;width:100%}
textarea{font-family:var(--f-data);font-size:.8rem;min-height:110px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}

/* pitch */
.pitchwrap{max-width:340px;width:100%;margin-inline:auto}
.pitch{width:100%;height:auto;display:block;background:#1f7a3a}
.pitch .ln{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1.5}
.pitch .dot{cursor:pointer}
.pitch .dot circle{stroke:#fff;stroke-width:2}
.pitch .dot.sel circle{stroke:#ffe600;stroke-width:4}
.pitch .dot.oop circle{stroke:#ffb020;stroke-dasharray:3 2}
.pitch .dot.xx circle{opacity:.45}
.pitch text{font-family:'IBM Plex Mono',monospace;text-anchor:middle;pointer-events:none}
.pitch .nmt{font-size:10px;fill:#fff;stroke:#0a2a14;stroke-width:3;paint-order:stroke;font-family:'Barlow Semi Condensed',Arial,sans-serif;font-weight:600}
.pitch .ov{font-size:12px;font-weight:500}

/* match */
.score{font-family:var(--f-disp);font-size:3.4rem;line-height:1;white-space:nowrap}
.board{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.feed{list-style:none;margin:0;padding:0;max-height:420px;overflow-y:auto}
.feed li{display:grid;grid-template-columns:3em 4.6em minmax(0,1fr);gap:6px;padding:4px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:.95rem}
.feed .mn{font-family:var(--f-data);font-size:.8rem;color:var(--muted)}
.feed .tg{font-family:var(--f-data);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:0 4px;text-align:center;border:1px solid var(--line);color:var(--muted)}
.feed .goal .tg{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.feed .goal{font-weight:600}.feed .note{color:var(--muted);font-style:italic}.feed .note .tg{border-style:dashed}
.feed .red .tg{background:var(--bad);color:#fff;border-color:var(--bad)}
.feed .yellow .tg{color:var(--warn);border-color:var(--warn)}
.feed .injury .tg,.feed .sub .tg{color:var(--cy);border-color:var(--cy)}
.statrow{display:grid;grid-template-columns:3.2em 1fr 3.2em;gap:8px;align-items:center;font-family:var(--f-data);font-size:.85rem;padding:3px 0}
.statrow span:last-child{text-align:right}
.statrow .lbl{text-align:center}
.bench-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.bench-list button{width:100%;display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);padding:3px 8px;cursor:pointer}
.bench-list button.sel{border-color:var(--accent);background:var(--me)}
.bench-list button:disabled{opacity:.5;cursor:not-allowed}

/* start */
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.club{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;text-align:left;background:var(--panel);border:2px solid var(--line);padding:8px;cursor:pointer;align-items:center}
.club:hover{border-color:var(--fg)}
.club[aria-pressed="true"]{border-color:var(--accent);background:var(--me)}
.club .crest{width:38px;height:38px;font-size:.95rem}
details summary{cursor:pointer;font-weight:600}

/* ---- 600 Finance ---- */
function spark(h) {
  if (h.length < 2) return '<p class="muted">The balance chart appears once two Saturdays have passed this season.</p>';
  const W = 640, H = 160, L = 56, R = 14, T = 14, B = 26;
  let lo = Math.min(...h), hi = Math.max(...h); if (hi - lo < 1e5) { hi += 5e4; lo -= 5e4; }
  const x = i => L + i * (W - L - R) / (h.length - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const pts = h.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  const mid = (hi + lo) / 2;
  return `<svg class="sparkline" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash balance each Saturday"><rect width="${W}" height="${H}" fill="none"/>
  ${[hi, mid, lo].map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="ax" x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${(v / 1e6).toFixed(1)}m</text>`).join('')}
  <polyline class="ln" points="${pts}"/><circle class="pt" cx="${x(h.length - 1).toFixed(1)}" cy="${y(h[h.length - 1]).toFixed(1)}" r="4.5"/>
  <text class="ax" x="${L}" y="${H - 8}">Wk 1</text><text class="ax" x="${W - R}" y="${H - 8}" text-anchor="end">Wk ${h.length}</text></svg>`;
}
function viewFinance() {
  const c = me(), f = G.fin, wb = wageBill(G, c) + staffBill(G), att = attendance(c), gate = att * c.ticket, cn = concNet(c, att).net;
  const wkNet = c.commercial * 0.65 + (G.sponsor ? G.sponsor.perWeek : 0) + G.ads.reduce((x, a) => x + (a ? a.perWeek : 0), 0) + (gate + cn) / 2 - wb - runCost(c);
  const inc = f.gate + f.commercial + f.sponsor + f.ads + f.conc + f.sold + f.prize, out = f.wages + (f.run || 0) + f.bought + f.other + f.build;
  const line = (l, v, cls) => `<tr><td class="nm">${l}</td><td class="r ${cls || ''}">${money2(v)}</td></tr>`;
  return `${band('FINANCE', 'SEASON ' + G.season)}
  <div class="panel"><div class="stack">
    <div class="grid3"><div class="kv"><span class="lbl">Cash in the bank</span><b class="${c.cash < 0 ? 'bad' : ''}">${money2(c.cash)}</b><span class="muted">This is also your transfer budget</span></div>
    <div class="kv"><span class="lbl">Wage bill</span><b>${money(wb)}</b><span class="muted">a week, players and staff. The stadium costs ${money(runCost(c))} a week to run.</span></div>
    <div class="kv"><span class="lbl">Expected weekly net</span><b class="${wkNet < 0 ? 'bad' : 'good'}">${wkNet < 0 ? '' : '+'}${money(wkNet)}</b><span class="muted">all income, with half a home gate a week</span></div></div>
    <div>${spark(G.cashHist)}</div>
    <div class="grid2" style="align-items:start">
      <div><div class="lbl" style="margin-bottom:4px">Season to date</div><div class="scroll"><table class="tbl"><tbody>${line('Gate receipts', f.gate)}${line('TV and central money', f.commercial)}${line('Kit sponsor', f.sponsor)}${line('Stadium adverts', f.ads)}${line('Shops and catering', f.conc)}${line('Player sales', f.sold)}${line('Prize money', f.prize)}${line('Wages (players and staff)', -f.wages)}${line('Stadium running costs', -(f.run || 0))}${line('Player purchases', -f.bought)}${line('Building work', -f.build)}${line('Release settlements', -f.other)}<tr><td class="nm"><b>Net</b></td><td class="r ${inc - out < 0 ? 'bad' : 'good'}"><b>${money2(inc - out)}</b></td></tr></tbody></table></div></div>
      <div class="stack"><div class="lbl">Matchdays</div><div class="data">Ticket price ${CUR}${c.ticket} · crowd ${att.toLocaleString('en-GB')} of ${c.capacity.toLocaleString('en-GB')}</div>${meter(att / c.capacity * 100, att / c.capacity > 0.85 ? 'g' : '')}
      <div class="data">Gate per home game ${money(gate)} · shops ${money(cn)}</div><div class="row"><button class="btn sm" data-act="tab" data-v="700">Set prices and sponsors</button><button class="btn sm" data-act="tab" data-v="750">Stadium</button></div>
      <p class="note">League prize money is paid at the end of the season and is bigger in higher divisions. Cup prize money is paid as you win ties.</p></div>
    </div></div></div>`;
}

async function gz(text) {
  if (typeof CompressionStream === 'undefined') return 'j:' + text;
  const cs = new CompressionStream('gzip'), w = cs.writable.getWriter(); w.write(new TextEncoder().encode(text)); w.close();
  const buf = new Uint8Array(await new Response(cs.readable).arrayBuffer()); let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return 'z:' + btoa(bin);
}
async function ungz(s) {
  if (s.startsWith('j:')) return s.slice(2);
  const bin = atob(s.slice(2)), arr = Uint8Array.from(bin, c => c.charCodeAt(0)), ds = new DecompressionStream('gzip'), w = ds.writable.getWriter(); w.write(arr); w.close();
  return await new Response(ds.readable).text();
}
